name: faultbench
on:
  push:
    branches: [egla287-faultbench]
jobs:
  windows:
    strategy:
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - run: cl /nologo /O2 /EHsc /std:c++20 tools/faultbench/bench2.cpp /Fe:bench2.exe psapi.lib
      - run: ./bench2.exe
      - run: ./bench2.exe
      - run: ./bench2.exe
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: g++ -O2 -std=c++20 -pthread tools/faultbench/bench2.cpp -o bench2 && ./bench2 && ./bench2

