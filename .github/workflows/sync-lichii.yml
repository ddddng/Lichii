
name: Mirror Lichii

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror-lichii
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Install git-filter-repo
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/filter-venv"
          "$RUNNER_TEMP/filter-venv/bin/pip" install --quiet git-filter-repo
          echo "$RUNNER_TEMP/filter-venv/bin" >> "$GITHUB_PATH"

      - name: Clone every upstream branch and tag
        shell: bash
        run: |
          set -euo pipefail
          git clone --mirror \
            https://github.com/zortos293/Lichii.git \
            "$RUNNER_TEMP/lichii.git"

      - name: Rename upstream workflow directory across Git history
        shell: bash
        run: |
          set -euo pipefail
          git -C "$RUNNER_TEMP/lichii.git" filter-repo --force \
            --path-rename '.github/workflows/:.github/upstream-workflows/'

          if git -C "$RUNNER_TEMP/lichii.git" show-ref \
            --verify --quiet refs/heads/sync-lichii; then
            echo '::error::Upstream has a sync-lichii branch. Rename your automation branch first.'
            exit 1
          fi

          if git -C "$RUNNER_TEMP/lichii.git" rev-list --objects --all \
              | grep -F ' .github/workflows/' ; then
            echo '::error::An upstream workflow path was not renamed.'
            exit 1
          fi

      - name: Sync all branch and tag names to this private repository
        shell: bash
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/lichii.git"
          destination="https://github.com/${GITHUB_REPOSITORY}.git"

          mapfile -t refs < <(
            git -C "$repo" for-each-ref --format='%(refname)' \
              refs/heads refs/tags
          )

          if (( ${#refs[@]} == 0 )); then
            echo '::error::No branches or tags found.'
            exit 1
          fi

          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          refspecs=()

          for ref in "${refs[@]}"; do
            refspecs+=("+${ref}:${ref}")

            if (( ${#refspecs[@]} >= 80 )); then
              git -C "$repo" \
                -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
                push "$destination" "${refspecs[@]}"
              refspecs=()
            fi
          done

          if (( ${#refspecs[@]} > 0 )); then
            git -C "$repo" \
              -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
              push "$destination" "${refspecs[@]}"
          fi

          echo 'Finished syncing all branches and tags.'
